<!doctype html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تجربة تبوك بالواقع المعزز</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    #start {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
    }
    #startBox {
      width: 100%;
      max-width: 360px;
    }
    #start h2 {
      margin-bottom: 15px;
    }
    #start p {
      line-height: 1.8;
      font-size: 15px;
    }
    #startBtn {
      margin-top: 15px;
      border: 0;
      border-radius: 14px;
      padding: 15px 28px;
      font-size: 18px;
      font-weight: bold;
      background: white;
      color: #111;
    }
    #startBtn:disabled {
      opacity: 0.6;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.7;
      color: #ddd;
    }
    #soundBtn {
      position: fixed;
      left: 15px;
      bottom: 20px;
      z-index: 10000;
      display: none;
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      background: white;
      color: #111;
    }
  </style>
</head>
<body>
  <!-- شاشة البداية -->
  <div id="start">
<div id="startBox">
  <h2>تجربة تبوك بالواقع المعزز</h2>
  <p>
    اضغطي «ابدأ التجربة» ثم اسمحي للمتصفح باستخدام الكاميرا.
  </p>
  <button id="startBtn">
    ابدأ التجربة
  </button>
  <div id="status"></div>
</div>
  </div>
  <!-- زر الصوت -->
  <button id="soundBtn">
    🔊 تشغيل الصوت
  </button>
  <!-- AR -->

<a-scene

mindar-image="
  imageTargetSrc: ./targets.mind;
  autoStart: false;
  uiLoading: no;
  uiScanning: no;
  uiError: no;
"
color-space="sRGB"
renderer="
  colorManagement: true;
  antialias: true;
"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
embedded
<a-assets>
  <video
    id="arVideo"
    src="./video.mp4"
    preload="auto"
    playsinline
    webkit-playsinline
    muted
    crossorigin="anonymous">
  </video>
</a-assets>
<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>
<!-- التارقت -->
<a-entity
  id="target"
  mindar-image-target="targetIndex: 0">
  <a-video
    id="videoPlane"
    src="#arVideo"
    position="0 0 0.02"
    width="1"
    height="0.5625">
  </a-video>
</a-entity>
  </a-scene>
  <script>
    const scene = document.querySelector("a-scene");
    const startScreen =
      document.getElementById("start");
    const startBtn =
      document.getElementById("startBtn");
    const status =
      document.getElementById("status");
    const video =
      document.getElementById("arVideo");
    const target =
      document.getElementById("target");
    const soundBtn =
      document.getElementById("soundBtn");
    let started = false;
    /*
     * زر بدء التجربة
     */
    startBtn.addEventListener("click", async function () {
      if (started) return;
      startBtn.disabled = true;
      status.textContent =
        "جاري تشغيل الكاميرا...";
      try {
        /*
         * تجهيز الفيديو
         */
        video.muted = true;
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");
        video.setAttribute(
          "webkit-playsinline",
          ""
        );
        /*
         * انتظار تحميل A-Frame
         */
        if (!scene.hasLoaded) {
          await new Promise(function (resolve) {
            scene.addEventListener(
              "loaded",
              resolve,
              { once: true }
            );
          });
        }
        /*
         * الحصول على MindAR
         */
        const mindar =
          scene.systems["mindar-image-system"];
        if (!mindar) {
          throw new Error(
            "MindAR system not found"
          );
        }
        /*
         * تشغيل الكاميرا
         */
        await mindar.start();
        started = true;
        /*
         * إخفاء شاشة البداية
         */
        startScreen.style.display = "none";
        console.log(
          "MindAR camera started"
        );
      } catch (error) {
        console.error(
          "Camera error:",
          error
        );
        status.textContent =
          "لم يتم تشغيل الكاميرا. تأكدي من السماح للمتصفح باستخدام الكاميرا.";
        startBtn.disabled = false;
      }
    });
    /*
     * عند العثور على التارقت
     */
    target.addEventListener(
      "targetFound",
      async function () {
        console.log(
          "Target found"
        );
        video.currentTime = 0;
        /*
         * يبدأ الفيديو صامتًا
         * حتى تسمح أجهزة iPhone بالتشغيل
         */
        video.muted = true;
        soundBtn.style.display =
          "block";
        soundBtn.textContent =
          "🔊 تشغيل الصوت";
        try {
          await video.play();
        } catch (error) {
          console.log(
            "Video play error:",
            error
          );
        }
      }
    );
    /*
     * عند اختفاء التارقت
     */
    target.addEventListener(
      "targetLost",
      function () {
        console.log(
          "Target lost"
        );
        video.pause();
        soundBtn.style.display =
          "none";
      }
    );
    /*
     * زر تشغيل / كتم الصوت
     */
    soundBtn.addEventListener(
      "click",
      async function () {
        if (video.muted) {
          try {
            video.muted = false;
            video.volume = 1;
            await video.play();
            soundBtn.textContent =
              "🔇 كتم الصوت";
          } catch (error) {
            console.log(
              "Audio error:",
              error
            );
            video.muted = true;
            soundBtn.textContent =
              "🔊 تشغيل الصوت";
          }
        } else {
          video.muted = true;
          soundBtn.textContent =
            "🔊 تشغيل الصوت";
        }
      }
    );
  </script>
</body>
</html>
