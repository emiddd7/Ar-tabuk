<!doctype html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover”

  <title>تجربة تبوك بالواقع المعزز</title>
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    a-scene {
      width: 100%;
      height: 100%;
    }
    #start {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
    }
    #box {
      max-width: 360px;
    }
    #start button {
      border: 0;
      border-radius: 14px;
      padding: 15px 28px;
      font-size: 18px;
      font-weight: bold;
      background: white;
      color: #111;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.7;
    }
    #soundBtn {
      position: fixed;
      left: 15px;
      bottom: 20px;
      z-index: 99999;
      display: none;
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      background: white;
      color: #111;
    }
  </style>
</head>
<body>
<div id="start">
  <div id="box">
<h2>تجربة تبوك بالواقع المعزز</h2>
<p>
  اضغطي «ابدأ التجربة» ثم اسمحي للمتصفح باستخدام الكاميرا.
</p>
<button id="startBtn">
  ابدأ التجربة
</button>
<div id="status"></div>
  </div>
</div>
<button id="soundBtn">
  🔊 تشغيل الصوت
</button>
<div class="container">

<a-scene

mindar-image="
  imageTargetSrc: ./targets.mind;
  autoStart: false;
  uiLoading: no;
  uiScanning: no;
  uiError: no;
"
embedded
color-space="sRGB"
renderer="
  colorManagement: true;
  physicallyCorrectLights: false;
"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
<a-assets>
  <video
    id="arVideo"
    src="./video.mp4"
    preload="auto"
    playsinline
    webkit-playsinline
    muted
    crossorigin="anonymous"
  ></video>
</a-assets>
<a-camera
  position="0 0 0"
  look-controls="enabled: false"
></a-camera>
<a-entity
  id="target"
  mindar-image-target="targetIndex: 0"
>
  <a-video
    id="videoPlane"
    src="#arVideo"
    position="0 0 0.01"
    width="1"
    height="0.5625"
  ></a-video>
</a-entity>
  </a-scene>
</div>
<script>
  const scene =
    document.querySelector("a-scene");
  const start =
    document.getElementById("start");
  const startBtn =
    document.getElementById("startBtn");
  const status =
    document.getElementById("status");
  const video =
    document.getElementById("arVideo");
  const target =
    document.getElementById("target");
  const soundBtn =
    document.getElementById("soundBtn");
  /*
   * تشغيل التجربة
   */
  startBtn.addEventListener("click", async function () {
    startBtn.disabled = true;
    status.textContent =
      "جاري تشغيل الكاميرا...";
    try {
      const arSystem =
        scene.systems["mindar-image-system"];
      if (!arSystem) {
        throw new Error(
          "MindAR system not found"
        );
      }
      /*
       * تشغيل MindAR
       */
      await arSystem.start();
      /*
       * إخفاء شاشة البداية
       */
      start.style.display = "none";
      console.log(
        "MindAR started"
      );
    }
    catch (error) {
      console.error(
        "MindAR error:",
        error
      );
      status.textContent =
        "تعذر تشغيل تجربة الواقع المعزز.";
      startBtn.disabled = false;
    }
  });
  /*
   * التارقت ظهر
   */
  target.addEventListener(
    "targetFound",
    async function () {
      console.log(
        "TARGET FOUND"
      );
      video.currentTime = 0;
      video.muted = true;
      soundBtn.style.display =
        "block";
      soundBtn.textContent =
        "🔊 تشغيل الصوت";
      try {
        await video.play();
      }
      catch (error) {
        console.log(
          "Video error:",
          error
        );
      }
    }
  );
  /*
   * التارقت اختفى
   */
  target.addEventListener(
    "targetLost",
    function () {
      video.pause();
      soundBtn.style.display =
        "none";
    }
  );
  /*
   * زر الصوت
   */
  soundBtn.addEventListener(
    "click",
    async function () {
      if (video.muted) {
        video.muted = false;
        video.volume = 1;
        try {
          await video.play();
          soundBtn.textContent =
            "🔇 كتم الصوت";
        }
        catch (error) {
          console.log(
            "Audio error:",
            error
          );
        }
      }
      else {
        video.muted = true;
        soundBtn.textContent =
          "🔊 تشغيل الصوت";
      }
    }
  );
</script>
</body>
</html>
