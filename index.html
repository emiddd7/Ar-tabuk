<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تشخيص الكاميرا</title>
  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }
    button {
      padding: 15px 25px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      margin-top: 20px;
    }
    #result {
      margin-top: 25px;
      padding: 15px;
      background: #222;
      border-radius: 12px;
      line-height: 1.8;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h2>تشخيص الكاميرا</h2>
  <p>
    اضغطي الزر لمعرفة سبب المشكلة.
  </p>
  <button onclick="testCamera()">
    اختبار الكاميرا
  </button>
  <div id="result">
    لم يتم الاختبار بعد
  </div>
  <script>
    async function testCamera() {
      const result =
        document.getElementById("result");
      result.innerHTML =
        "جاري الفحص...";
      try {
        result.innerHTML +=
          "<br>HTTPS: " +
          location.protocol;
        result.innerHTML +=
          "<br>mediaDevices: " +
          (navigator.mediaDevices ? "موجود" : "غير موجود");
        if (!navigator.mediaDevices) {
          throw new Error(
            "navigator.mediaDevices غير موجود"
          );
        }
        result.innerHTML +=
          "<br>getUserMedia: " +
          (
            navigator.mediaDevices.getUserMedia
              ? "موجود"
              : "غير موجود"
          );
        if (!navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "getUserMedia غير موجود"
          );
        }
        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
        result.innerHTML +=
          "<br><br>✅ الكاميرا اشتغلت!";
        stream
          .getTracks()
          .forEach(track => track.stop());
      } catch (error) {
        result.innerHTML +=
          "<br><br>❌ ERROR";
        result.innerHTML +=
          "<br>الاسم: " +
          error.name;
        result.innerHTML +=
          "<br>الرسالة: " +
          error.message;
        result.innerHTML +=
          "<br>النوع: " +
          error.toString();
        console.error(error);
      }
    }
  </script>
</body>
</html>
