<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no”

  <title>تجربة تبوك بالواقع المعزز</title>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #start {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
    }
    #startBox {
      width: 100%;
      max-width: 350px;
    }
    #start button {
      border: none;
      border-radius: 14px;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      background: white;
      color: #111;
      margin-top: 10px;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.7;
    }
    #soundBtn {
      position: fixed;
      z-index: 10000;
      left: 15px;
      bottom: 20px;
      display: none;
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      background: white;
      color: #111;
    }
    /*
      مهم:
      نخلي الـ scene يغطي الشاشة
    */
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- شاشة البداية -->
  <div id="start">
<div id="startBox">
  <h2>
    تجربة تبوك بالواقع المعزز
  </h2>
  <p>
    اضغطي «ابدأ التجربة» ثم اسمحي للمتصفح باستخدام الكاميرا.
  </p>
  <button id="startBtn">
    ابدأ التجربة
  </button>
  <div id="status"></div>
</div>
  </div>
  <!-- زر الصوت -->
  <button id="soundBtn">
    🔊 تشغيل الصوت
  </button>
  <!-- ========================= -->
  <!--        MINDAR AR           -->
  <!-- ========================= -->

<a-scene

mindar-image="
  imageTargetSrc: ./targets.mind;
  uiLoading: no;
  uiScanning: no;
  uiError: no;
"
color-space="sRGB"
renderer="
  colorManagement: true;
  physicallyCorrectLights: true;
"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
<!-- الفيديو -->
<a-assets>
  <video
    id="arVideo"
    src="./video.mp4"
    preload="auto"
    playsinline
    webkit-playsinline
    muted
    crossorigin="anonymous"
  ></video>
</a-assets>
<!-- الكاميرا -->
<a-camera
  position="0 0 0"
  look-controls="enabled: false"
></a-camera>
<!-- التارقت -->
<a-entity
  id="target"
  mindar-image-target="targetIndex: 0"
>
  <a-video
    id="videoPlane"
    src="#arVideo"
    position="0 0 0.01"
    width="1"
    height="0.5625"
  ></a-video>
</a-entity>
  </a-scene>
  <script>
    const scene =
      document.querySelector("a-scene");
    const start =
      document.getElementById("start");
    const startBtn =
      document.getElementById("startBtn");
    const status =
      document.getElementById("status");
    const video =
      document.getElementById("arVideo");
    const target =
      document.getElementById("target");
    const soundBtn =
      document.getElementById("soundBtn");
    /*
     * زر البداية
     */
    startBtn.addEventListener(
      "click",
      async function () {
        startBtn.disabled = true;
        status.textContent =
          "جاري تشغيل الكاميرا...";
        try {
          /*
           * نبدأ MindAR بالطريقة الافتراضية
           */
          const mindar =
            scene.systems["mindar-image-system"];
          if (!mindar) {
            throw new Error(
              "MindAR لم يتم تحميله"
            );
          }
          /*
           * MindAR يبدأ الكاميرا
           */
          await mindar.start();
          /*
           * نخفي شاشة البداية
           */
          start.style.display = "none";
          console.log(
            "CAMERA STARTED"
          );
        }
        catch (error) {
          console.error(
            error
          );
          status.textContent =
            "تعذر تشغيل الكاميرا. تأكدي من السماح للمتصفح باستخدام الكاميرا.";
          startBtn.disabled = false;
        }
      }
    );
    /*
     * عند العثور على الصورة
     */
    target.addEventListener(
      "targetFound",
      async function () {
        console.log(
          "TARGET FOUND"
        );
        video.currentTime = 0;
        video.muted = true;
        soundBtn.style.display =
          "block";
        soundBtn.textContent =
          "🔊 تشغيل الصوت";
        try {
          await video.play();
        }
        catch (error) {
          console.log(
            error
          );
        }
      }
    );
    /*
     * عند فقدان الصورة
     */
    target.addEventListener(
      "targetLost",
      function () {
        video.pause();
        soundBtn.style.display =
          "none";
      }
    );
    /*
     * الصوت
     */
    soundBtn.addEventListener(
      "click",
      async function () {
        if (video.muted) {
          video.muted = false;
          video.volume = 1;
          try {
            await video.play();
            soundBtn.textContent =
              "🔇 كتم الصوت";
          }
          catch (error) {
            console.log(
              error
            );
          }
        }
        else {
          video.muted = true;
          soundBtn.textContent =
            "🔊 تشغيل الصوت";
        }
      }
    );
  </script>
</body>
</html>
