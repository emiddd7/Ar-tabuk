<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tabuk AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;text-align:center;padding:24px;box-sizing:border-box}
#start>div{max-width:360px}
#start button{border:0;border-radius:14px;padding:14px 28px;font-size:18px;background:#fff;color:#111}
#status{margin-top:14px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div id="start">
<div>
<h2>تجربة تبوك بالواقع المعزز</h2>
<p>اضغطي «ابدأ التجربة» ثم اسمحي للمتصفح باستخدام الكاميرا.</p>
<button id="startBtn">ابدأ التجربة</button>
<div id="status"></div>
<button id="soundBtn" style="display:none;margin-top:12px;border:0;border-radius:12px;padding:10px 18px;font-size:16px;background:#fff;color:#111">🔊 تشغيل الصوت</button>
</div>
</div>

<a-scene
mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: yes;"
color-space="sRGB"
renderer="colorManagement: true; alpha: true"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
embedded>

<a-assets>
<video id="arVideo" src="./video.mp4" preload="auto" playsinline webkit-playsinline crossorigin="anonymous"></video>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">
<a-video id="videoPlane" src="#arVideo" position="0 0 0.02" width="1" height="0.5625"></a-video>
</a-entity>
</a-scene>

<script>
const scene=document.querySelector("a-scene");
const start=document.getElementById("start");
const startBtn=document.getElementById("startBtn");
const status=document.getElementById("status");
const video=document.getElementById("arVideo");
const target=document.querySelector("[mindar-image-target]");
const soundBtn=document.getElementById("soundBtn");

video.muted=true;
video.setAttribute("playsinline", "");
video.setAttribute("webkit-playsinline", "");

startBtn.addEventListener("click",async()=>{
startBtn.disabled=true;
status.textContent="جاري تشغيل الكاميرا...";
try{
const mindar=scene.systems["mindar-image-system"];
if(!mindar) throw new Error("MindAR system not found");
await mindar.start();
start.style.display="none";
}catch(err){
console.error(err);
status.textContent="تعذر تشغيل الكاميرا. تأكدي من السماح للكاميرا وفتح الرابط في Safari.";
startBtn.disabled=false;
}
});

target.addEventListener("targetFound",async()=>{
video.currentTime=0;
try{await video.play(); soundBtn.style.display="none";}catch(err){console.log(err); soundBtn.style.display="block";}
});
target.addEventListener("targetLost",()=>video.pause());
soundBtn.addEventListener("click",async()=>{ video.muted=false; try{await video.play(); soundBtn.style.display="none";}catch(err){console.log(err);} });
</script>
</body>
</html>
