<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار كاميرا تبوك</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }
    #box {
      max-width: 350px;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 15px 25px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }
    #status {
      margin-top: 15px;
      line-height: 1.7;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="start">
<div id="box">
  <h2>اختبار الكاميرا</h2>
  <p>
    اضغطي الزر واسمحي للمتصفح باستخدام الكاميرا.
  </p>
  <button id="btn">
    تشغيل الكاميرا
  </button>
  <div id="status"></div>
</div>
  </div>
  <script>
    const camera =
      document.getElementById("camera");
    const start =
      document.getElementById("start");
    const btn =
      document.getElementById("btn");
    const status =
      document.getElementById("status");
    btn.addEventListener(
      "click",
      async () => {
        try {
          status.textContent =
            "جاري تشغيل الكاميرا...";
          const stream =
            await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: {
                  ideal: "environment"
                }
              },
              audio: false
            });
          camera.srcObject =
            stream;
          start.style.display =
            "none";
          console.log(
            "CAMERA OK"
          );
        }
        catch (error) {
          console.error(
            error
          );
          status.textContent =
            "فشل تشغيل الكاميرا: " +
            error.name;
        }
      }
    );
  </script>
</body>
</html>
